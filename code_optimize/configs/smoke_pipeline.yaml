run:
  task_name: smoke_pipeline
  output_root: outputs

data:
  max_train_samples: 4
  max_eval_samples: 4

model:
  frontend_config:
    model_type: linear_frontend
    target_sampling_rate: 16000
    frame_ms: 25.0
    output_size: 128
  architecture_type: baseline
  backbone_config:
    architecture_type: baseline
    blocks:
      - attn: attention
        mlp: mlp
        num_layers: 1

loss:
  loss_type: cross_entropy

training:
  torch_compile: false
  num_train_epochs: 1
  max_steps: 2
  per_device_train_batch_size: 2
  per_device_eval_batch_size: 2
  dataloader_num_workers: 0
  eval_strategy: steps
  save_strategy: "no"
  logging_strategy: steps
  load_best_model_at_end: false
  early_stopping_patience: 0
